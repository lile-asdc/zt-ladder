name: 连板天梯 · 每日更新

on:
  schedule:
    # 北京时间 15:35 与 16:10（UTC 07:35 / 08:10），周一至周五
    - cron: "35 7 * * 1-5"
    - cron: "10 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 缓存个股日 K
        uses: actions/cache@v4
        with:
          path: .cache/kline
          key: kline-${{ github.run_id }}
          restore-keys: |
            kline-

      - name: 缓存中文字体
        uses: actions/cache@v4
        with:
          path: fonts
          key: cjk-font-noto-sc-v1

      - name: 准备中文字体
        run: |
          # runner 通常自带 Noto CJK，先用系统的，避免每次依赖外网
          if ls /usr/share/fonts/opentype/noto/NotoSansCJK*.ttc >/dev/null 2>&1; then
            echo "系统自带 Noto CJK，跳过下载"
            exit 0
          fi
          mkdir -p fonts
          base="https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/OTF/SimplifiedChinese"
          for name in NotoSansSC-Bold.otf NotoSansSC-Regular.otf; do
            [ -s "fonts/$name" ] && continue
            timeout 40 curl -fsSL -o "fonts/$name" "$base/$name" || rm -f "fonts/$name"
          done
          if [ ! -s fonts/NotoSansSC-Bold.otf ]; then
            echo "::warning::字体下载失败，尝试安装系统字体"
            timeout 150 sudo apt-get install -y --no-install-recommends fonts-noto-cjk || true
          fi
          ls -la fonts

      - name: 安装依赖
        run: pip install --no-cache-dir -r requirements.txt

      - name: 抓取数据 + 生成长图
        env:
          ZT_FONT_BOLD: ${{ github.workspace }}/fonts/NotoSansSC-Bold.otf
          ZT_FONT_REGULAR: ${{ github.workspace }}/fonts/NotoSansSC-Regular.otf
        run: python build/cli.py daily

      - name: 提交当日数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public
          if git diff --cached --quiet; then
            echo "没有新数据，跳过提交"
          else
            git commit -m "data: $(TZ=Asia/Shanghai date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
